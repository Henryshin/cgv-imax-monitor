name: CGV IMAX Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 신규 탐지 (월 1,440분)
    - cron: '0 0 * * *'     # 매일 09:00 (UTC+9 = KST) 현황 보고
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        options: [monitor, report]
        default: monitor

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 0 * * *' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'monitor')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_NO: 0013
          SCREEN_KEYWORD: IMAX
        run: node monitor.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push

  daily-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'report')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_NO: 0013
          SCREEN_KEYWORD: IMAX
        run: node monitor.js report
